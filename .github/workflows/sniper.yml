name: CROUS Sniper

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:
    inputs:
      relist_all:
        description: 'Force list ALL available housing?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sniper:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          pip install requests aiohttp
      
      - name: Run Hybrid Sniper
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          FORCE_RELIST: ${{ github.event.inputs.relist_all }}
        run: python main.py
      
      - name: Commit changes
        run: |
          git config --global user.name "CROUS Bot"
          git config --global user.email "bot@noreply.github.com"
          git add history.json crous_monitor.log
          git commit -m "🤖 Update housing state [skip ci]" || echo "No changes to commit"
          git push