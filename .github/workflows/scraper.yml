name: Check CROUS

on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 15 minutes automatically
  workflow_dispatch: # Allows manual click
    inputs:
      relist_all:
        description: 'Force list ALL available housing?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install libraries
        run: pip install requests

      - name: Run Scraper
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          # Pass the checkbox value to Python
          FORCE_RELIST: ${{ github.event.inputs.relist_all }} 
        run: python main.py

      - name: Save History
        run: |
          git config --global user.name "CROUS Bot"
          git config --global user.email "bot@noreply.github.com"
          git add history.json
          git commit -m "Update housing history [skip ci]" || echo "No changes to commit"
          git push